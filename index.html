<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How cosy are you?</title>
  <meta name="description" content="Rate your cosiness. The fire knows.">
  <meta name="theme-color" content="#f6ecd9">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cosy-autumn.milettegillow.com">
  <meta property="og:title" content="How cosy are you?">
  <meta property="og:description" content="Rate your cosiness. The fire knows.">
  <meta property="og:image" content="https://cosy-autumn.milettegillow.com/assets/fireplace.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="How cosy are you?">
  <meta name="twitter:description" content="Rate your cosiness. The fire knows.">
  <meta name="twitter:image" content="https://cosy-autumn.milettegillow.com/assets/fireplace.png">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient rain" aria-hidden="true"></div>

  <main>
    <h1>How cosy are you?</h1>

    <div class="layout">
      <div class="stage">
        <div class="hearth">
          <img class="fireplace" src="assets/fireplace.png" alt="A watercolour stone fireplace with logs in the grate">
          <img class="beam-front" src="assets/fireplace.png" alt="" aria-hidden="true">

          <div class="flame-wrap" aria-hidden="true">
            <img class="flame" src="assets/flame.png" alt="">
          </div>

          <div class="mantel" aria-hidden="true">
            <div class="slot" data-item="candle"><img src="assets/candle.png" alt=""></div>
            <div class="slot" data-item="mug"><img src="assets/mug.png" alt=""></div>
            <div class="slot" data-item="cat"><img src="assets/cat.png" alt=""></div>
            <div class="slot" data-item="socks"><img src="assets/socks.png" alt=""></div>
            <div class="slot" data-item="blanket"><img src="assets/blanket.png" alt=""></div>
          </div>

          <p class="score" id="score" aria-live="polite">0</p>
        </div>
      </div>

      <div class="panel">
        <p class="tier" id="tier">Hostile</p>

        <div class="chips" id="chips"></div>

        <ul class="combos" id="combos"></ul>

        <button type="button" class="share" id="share">Share my cosiness</button>
      </div>
    </div>
  </main>

  <div class="ambient big-light" aria-hidden="true"></div>
  <div class="cold cold-hue" aria-hidden="true"></div>
  <div class="cold cold-wash" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
